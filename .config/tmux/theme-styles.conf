# Theme-dependent styles.
# Sourced by theme-colors.sh after @thm_* is synced from the active Omarchy
# theme, so nothing here is baked with a stale Catppuccin flavor.
# Backgrounds use `default` so Ghostty's background-opacity/Hyprland blur
# shows through tmux instead of being painted over.

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=default,fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:20,#(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh | tr -cd 0-9)},#[fg=#{@thm_red}],#[fg=#{@thm_pink}]}#(~/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh) #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh) "
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y/%m/%d 󰅐 %H:%M "
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰅐 %H:%M "

# Configure Tmux
set -g status-position top
set -g status-style "bg=default,fg=#{@thm_fg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status off # top : to add border
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=default,fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=default,fg=#{@thm_peach},bold,underscore"

# popups, menus and prompts: no painted background, same glass as the window
set -g popup-style "bg=default,fg=#{@thm_fg}"
set -g popup-border-style "bg=default,fg=#{@thm_overlay_0}"
set -g menu-style "bg=default,fg=#{@thm_fg}"
set -g menu-selected-style "bg=#{@thm_peach},fg=#{@thm_bg}"
set -g message-style "bg=default,fg=#{@thm_teal}"
set -g message-command-style "bg=default,fg=#{@thm_teal}"

set -gu window-style
set -gu window-active-style
