set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:Tc"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set -g mouse on

# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix
unbind C-Space
set -g prefix C-b
bind C-b send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alt- hl to switch horizontal panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R

# status bar
set -g status-position top

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# optional: restore automatically when tmux starts
# set -g @continuum-restore 'on'
# optional: auto-save every 15 min
# set -g @continuum-save-interval '15'

# Theme Ref: https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512
set -g @plugin 'catppuccin/tmux'
# keybinding# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Status line, window and pane styles live in theme-styles.conf so they are
# applied after the Omarchy palette is loaded (see the end of this file).


# keybindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind T new-window -a -c "#{pane_current_path}" -n "Term:#{window_name}"
unbind-key "S"
bind-key "S" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

bind-key -r i run-shell "tmux neww ~/dotfiles/my-scripts/workspace.sh"

# Open opencode in a horizontal split (prefix + O)
bind O split-window -h -l 80 -c "#{pane_current_path}" "opencode"
# Open claude in a horizontal split (prefix + C)
bind C split-window -h -l 80 -c "#{pane_current_path}" "claude --ide"

# Toggle to last pane and zoom (prefix + o)
bind o last-pane 

# Reload config (prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Auto-rename windows based on current directory
set-hook -g pane-focus-in 'run-shell "~/.config/tmux/auto-rename.sh #{pane_current_path}"'

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Sync the @thm_* palette from the active Omarchy theme, then source
# theme-styles.conf. Runs on every reload, so a theme change just needs a
# `prefix + r` (the theme-set hook does it automatically too).
run-shell '~/.config/tmux/theme-colors.sh'
