gui:
  splitDiff: "auto" # one of 'auto' | 'always'
  showBottomLine: false
  expandFocusedSidePanel: true
  nerdFontsVersion: "3"
  showFileIcons: true
  border: "rounded" #"rounded" "normal"
  sidePanelWidth: 0.25
promptToReturnFromSubprocess: true
git:
  log:
    showGraph: always
    showWholeGraph: true
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
os:
  # Same as lazygit's built-in `nvim-remote` preset, but with `--remote` instead
  # of `--remote-tab` so the file replaces the current buffer rather than opening
  # a new tab. Keeping `editPreset` set means `suspend` still resolves correctly:
  # outside Neovim ($NVIM unset) lazygit suspends and opens nvim in the terminal.
  editPreset: "nvim-remote"
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'
customCommands:
  - key: "a"
    context: "localBranches"
    command: "git pull; git pull --tags"
  - key: "A"
    context: "localBranches"
    command: "git push; git push --tags"
