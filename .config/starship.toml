add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "bold italic red"

[git_status]
format     = '$all_status'
style      = "yellow"
ahead      = "[⇡${count} ](green)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count} ](yellow)"
behind     = "[⇣${count} ](red)"
conflicted = "[ ](red)"
up_to_date = "[ ](green)"
untracked  = "[? ](blue)"
modified   = "[ ](yellow)"
stashed    = "[](purple)"
staged     = "[](green)"
renamed    = "[](purple)"
deleted    = "[](red)"
